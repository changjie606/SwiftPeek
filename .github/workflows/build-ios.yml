name: Build SwiftPeek iOS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Archive iOS Simulator
        run: |
          xcodebuild archive \
            -scheme SwiftPeek \
            -destination 'generic/platform=iOS Simulator' \
            -archivePath ./archives/SwiftPeek-sim.xcarchive \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Archive iOS Device
        run: |
          xcodebuild archive \
            -scheme SwiftPeek \
            -destination 'generic/platform=iOS' \
            -archivePath ./archives/SwiftPeek-device.xcarchive \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Make XCFramework
        run: |
          rm -rf SwiftPeek.xcframework
          xcodebuild -create-xcframework \
            -archive ./archives/SwiftPeek-device.xcarchive -framework SwiftPeek.framework \
            -archive ./archives/SwiftPeek-sim.xcarchive -framework SwiftPeek.framework \
            -output SwiftPeek.xcframework

      - name: Upload XCFramework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftPeek-XCFramework
          path: SwiftPeek.xcframework
